  let date = new Date()
  let dayInMonth = Math.min(date.getDate(), 24)
  let month = date.getMonth()

  if (month < 6 || month == 11) {
    for (let i = dayInMonth; i >= 1; i--) { // day loop
      document.write("<h1>December " + i + "</h1>");
      for (let j = 1; j< 4; j++) { // song loop
        let file = "day" + (i).toString().padStart(2, "0") + "_song" + j + ".png"
        if (!files[file]) {
          continue
        }

        document.write("<a href=\"" + files[file] + "\"><img src=\"images/" + file + "\"><\a>");
      }
      document.write("<br><br>");
    }
  }
